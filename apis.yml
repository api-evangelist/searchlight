name: Searchlight
description: >-
  Searchlight (searchlight.ai) is an Accel-backed company in the services sector,
  added to the API Evangelist network from Accel's portfolio. Its primary web
  presence is a Webflow-hosted marketing site at www.searchlight.ai, with a
  product application at app.searchlight.ai and an internal API host at
  api.searchlight.ai — both of which sit behind Cloudflare and return HTTP 525
  (origin unreachable to the public), and the marketing site rejects non-browser
  TLS clients, so no public developer documentation, OpenAPI, or SDKs could be
  discovered. A public Instatus status page is live at status.searchlight.ai
  (monitoring Website and App components). Email runs on Google Workspace with
  HubSpot, and the domain publishes SPF and DMARC records. This profile captures
  the verifiable public infrastructure; no public API surface was found.
